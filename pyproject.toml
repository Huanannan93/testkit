[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "testkit"
version = "1.0.0"
description = "test-ecosystem 底座CLI：个人AI测试生态系统管理器"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "questionary>=2.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
]
license = {text = "MIT"}
authors = [
    {name = "Huanannan93"}
]
readme = "README.md"

[project.scripts]
testkit = "testkit.main:app"

[tool.setuptools.packages.find]
include = ["testkit*"]
